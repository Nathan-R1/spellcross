<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The Long Night: a single candle under a dark sky, the first light of dawn on the horizon -->
  <rect width="128" height="128" rx="10" fill="#141829"/>
  <!-- faint dawn glow on the horizon -->
  <path d="M0 92 Q64 78 128 92 V128 H0Z" fill="#3a2f4a"/>
  <path d="M0 98 Q64 88 128 98 V128 H0Z" fill="#1c1a2a"/>
  <!-- thin moon and stars -->
  <path d="M96 20 a12 12 0 1 0 8 20 a10 10 0 1 1 -8 -20z" fill="#c9cfe0" opacity=".85"/>
  <g fill="#c9cfe0" opacity=".7">
    <circle cx="22" cy="18" r="1.4"/><circle cx="40" cy="30" r="1"/><circle cx="62" cy="14" r="1.2"/>
    <circle cx="76" cy="40" r=".9"/><circle cx="16" cy="48" r="1"/><circle cx="114" cy="56" r="1.1"/>
  </g>
  <!-- candle -->
  <rect x="58" y="76" width="12" height="30" rx="2" fill="#e8dcc0" stroke="#5a4e3a" stroke-width="1.5"/>
  <path d="M64 76 v-5" stroke="#2a2420" stroke-width="1.5"/>
  <ellipse cx="64" cy="66" rx="5" ry="9" fill="#f3b44a" opacity=".35"/>
  <path d="M64 58 q5 7 0 13 q-5-6 0-13z" fill="#f6c95a"/>
  <rect x="50" y="104" width="28" height="5" rx="2" fill="#5a4e3a"/>
</svg>
