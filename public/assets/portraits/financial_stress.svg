  <g transform="rotate(-14 52 70)">
    <rect x="22" y="30" width="60" height="78" rx="3" fill="#d9d2bf" stroke="#5c5444" stroke-width="2"/>
    <g stroke="#8a8170" stroke-width="2" stroke-linecap="round"><path d="M30 46h40M30 56h32M30 66h38M30 76h26"/></g>
  </g>
  <g transform="rotate(9 76 66)">
    <rect x="44" y="24" width="60" height="80" rx="3" fill="#eee8d6" stroke="#5c5444" stroke-width="2"/>
    <text x="54" y="44" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5c5444">BILL</text>
    <g stroke="#9a917f" stroke-width="2" stroke-linecap="round"><path d="M52 54h40M52 63h30M52 72h36"/></g>
